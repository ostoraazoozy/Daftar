name: Build Real Android App
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Clone Webview Template
        run: |
          # سحب مشروع أندرويد استوديو جاهز ومفتوح المصدر مخصص للـ WebView
          git clone https://github.com template
          
          # نقل ملفات كودك الثلاثة إلى مجلد الأصول داخل تطبيق أندرويد
          rm -rf template/app/src/main/assets/*
          cp index.html template/app/src/main/assets/
          cp script.js template/app/src/main/assets/ || true
          cp style.css template/app/src/main/assets/ || true

      - name: Grant Execute Permission for Gradle
        run: chmod +x template/gradlew

      - name: Build Android APK
        run: |
          cd template
          ./gradlew assembleDebug --no-daemon

      - name: Upload Real APK
        uses: actions/upload-artifact@v4
        with:
          name: Real-Android-App
          path: template/app/build/outputs/apk/debug/app-debug.apk
