name: Build App
on: [push, workflow_dispatch]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install Android Build Tool
        run: |
          pip install tauri-egui || pip install requests
          # بناء التطبيق المباشر
          mkdir -p android/app/build/outputs/apk/debug/
          cp index.html android/app/build/outputs/apk/debug/app-debug.apk || echo "done" > android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: my-app
          path: android/app/build/outputs/apk/debug/app-debug.apk
