name: Build Android App
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Initialize and Build App
        run: |
          # إنشاء ملف package.json وتجهيز البيئة
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          # تهيئة مشروع كاباسيتور برمجياً بالكامل
          npx cap init "Daftar App" "com.ostoraazoozy.daftar" --web-dir=. --bundled-web-runtime=false
          
          # إضافة منصة أندرويد وإنشاء المجلدات اللازمة
          npx cap add android
          npx cap sync android

      - name: Build Android APK
        run: |
          cd android && ./gradlew assembleDebug

      - name: Upload APK Package
        uses: actions/upload-artifact@v4
        with:
          name: my-android-app
          path: android/app/build/outputs/apk/debug/app-debug.apk
