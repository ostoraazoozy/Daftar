name: Build Android App
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Initialize App Config
        run: |
          echo '{"name": "daftar", "version": "1.0.0"}' > package.json
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Daftar App" "com.ostoraazoozy.daftar" --web-dir=. --confirm

      - name: Add Android Platform
        run: |
          npx cap add android
          # أمر حاسم للموافقة الصامتة والتلقائية على تراخيص Android SDK لمنع التعليق
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          npx cap sync android

      - name: Build Android APK
        run: |
          cd android && ./gradlew assembleDebug --no-daemon

      - name: Upload APK Package
        uses: actions/upload-artifact@v4
        with:
          name: my-android-app
          path: android/app/build/outputs/apk/debug/app-debug.apk
